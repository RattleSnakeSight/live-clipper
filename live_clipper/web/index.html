<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Live Clipper</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-help="Jump past the menu to the page content.">Skip to content</a>
  <header class="topbar">
    <a class="wordmark" href="#/dashboard" data-help="Go to the dashboard.">Live Clipper</a>
    <div class="topbar-end">
      <span id="health-badge" class="pill neutral" role="status">Checking</span>
      <a class="btn ghost" href="#/guide" data-help="Open the built-in guide. It works offline.">Guide</a>
    </div>
  </header>
  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Main">
      <div class="sidebar-inner">
        <ul>
          <li><a href="#/dashboard" data-route="dashboard" data-help="Live status of every channel, recent clips and posting.">Dashboard</a></li>
        </ul>
        <p class="nav-label" id="nav-watch">Watch</p>
        <ul aria-labelledby="nav-watch">
          <li><a href="#/channels" data-route="channels" data-help="Add, edit, pause or remove the channels you watch.">Channels</a></li>
          <li><a href="#/sources" data-route="sources" data-help="Connect Twitch, Kick and YouTube so the app can see streams and chat.">Sources</a></li>
        </ul>
        <p class="nav-label" id="nav-clip">Clip</p>
        <ul aria-labelledby="nav-clip">
          <li><a href="#/clips" data-route="clips" data-help="Watch, fix and post the clips the app made.">Clips</a></li>
          <li><a href="#/formats" data-route="formats" data-help="Decide which moments become clips, and set rules for exceptions.">Formats and rules</a></li>
          <li><a href="#/presets" data-route="presets" data-help="Decide how clips look: framing, captions, length.">Presets</a></li>
        </ul>
        <p class="nav-label" id="nav-post">Post</p>
        <ul aria-labelledby="nav-post">
          <li><a href="#/destinations" data-route="destinations" data-help="Connect the accounts clips are posted to.">Destinations</a></li>
        </ul>
        <p class="nav-label" id="nav-app">App</p>
        <ul aria-labelledby="nav-app">
          <li><a href="#/settings" data-route="settings" data-help="Storage, processing, notifications and the tutorial.">Settings</a></li>
          <li><a href="#/status" data-route="status" data-help="App health, restarts, disk and recent log lines.">Status</a></li>
          <li><a href="#/guide" data-route="guide" data-help="How everything works, step by step.">Guide</a></li>
        </ul>
      </div>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav class="tabbar" aria-label="Quick">
    <a href="#/dashboard" data-route="dashboard" data-help="Live status of every channel, recent clips and posting.">Dashboard</a>
    <a href="#/channels" data-route="channels" data-help="Add, edit, pause or remove the channels you watch.">Channels</a>
    <a href="#/clips" data-route="clips" data-help="Watch, fix and post the clips the app made.">Clips</a>
    <button type="button" id="menu-btn" aria-expanded="false" aria-controls="sidebar"
            data-help="Show or hide the full page menu.">Menu</button>
  </nav>
  <div id="tooltip" role="tooltip" hidden></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">Live Clipper needs JavaScript turned on in this browser.</p></noscript>
</body>
</html>
