[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-clipper"
dynamic = ["version"]
description = "Free, self-hosted, local-only app that watches livestreams, picks moments, cuts vertical clips and posts them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic>=2",
    "cryptography",
    "platformdirs",
    # captions: speech recognition + offline translation (models download on first use into the data dir)
    "faster-whisper>=1.1",
    "ctranslate2>=4.4",
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
live-clipper = "live_clipper.cli:main"

[tool.setuptools.dynamic]
version = { attr = "live_clipper.__version__" }

[tool.setuptools.packages.find]
include = ["live_clipper*"]

[tool.setuptools.package-data]
live_clipper = ["web/**/*", "formats/**/*", "presets/*.json", "models/*", "fonts/*"]

[tool.ruff]
line-length = 110
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# media modules ported line-for-line from the original design: keep their layout for reviewable parity
"live_clipper/{buffer,timeline,clipper,render,postprocess,facecam,faces,loudness}.py" = ["E501", "E741", "B905", "B023", "B007", "B904", "UP045", "UP035", "UP041", "UP037"]
"live_clipper/captions/*.py" = ["E501", "E741", "B905", "B023", "B007", "B904", "UP045", "UP035", "UP041", "UP037"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["asr: real faster-whisper run (downloads a model on first use; opt in with LIVE_CLIPPER_ASR_TEST=1)"]
# starlette nags about its own httpx dependency; not actionable here
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Query"]
