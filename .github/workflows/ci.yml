name: CI

on:
  push:
    branches: [main, "lc/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,ui]"
      - run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: python -m playwright install chromium
        if: runner.os != 'Linux'
      - run: ruff check .
      - run: python -m pytest -q -rs --durations=20

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (all history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gl.tgz gitleaks
          ./gitleaks git . --log-opts="--all" --redact --no-banner

  ci-ok:
    if: always()
    needs: [test, secrets]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.secrets.result }}" = success
